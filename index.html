<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deutsch Freunde B2</title><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f7f7f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Freunde B2">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* iOS 7 : flat, fin, translucide, bleu système */
:root{
  --g:#007aff;
  --g2:#007aff;
  --cr:#efeff4;
  --bg:#efeff4;
  --cd:#fff;
  --tx:#000;
  --mu:#8e8e93;
  --bd:rgba(60,60,67,.22);
  --ok:#34c759;--ko:#ff3b30;--warn:#ffcc00;
  --bar:rgba(247,247,247,.82)
}
@media (prefers-color-scheme:dark){
  :root{--cr:#1c1c1e;--bg:#000;--cd:#1c1c1e;--tx:#fff;--mu:#98989f;--bd:rgba(84,84,88,.6);--g:#0a84ff;--g2:#0a84ff;--bar:rgba(29,29,31,.82)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);
  font:17px/1.4 -apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top)}

/* Barre de navigation translucide */
header{position:sticky;top:env(safe-area-inset-top);z-index:5;
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--bd);color:var(--tx);
  padding:11px 16px;display:flex;justify-content:space-between;align-items:center;min-height:44px}
header b{font:600 17px/1.2 -apple-system,"Helvetica Neue",sans-serif;letter-spacing:-.2px}
#who{color:var(--g)!important;font-size:15px}

main{max-width:760px;margin:auto;padding:16px 16px calc(84px + env(safe-area-inset-bottom))}
h2{font:700 30px/1.15 -apple-system,"Helvetica Neue",sans-serif;letter-spacing:-.6px;color:var(--tx);margin:8px 2px 14px}
h3{margin:0 0 4px;font-size:17px;font-weight:600;letter-spacing:-.2px}

/* Cartes */
.c{background:var(--cd);border-radius:10px;padding:14px 16px;margin:0 0 12px;border:0}
.m{color:var(--mu);font-size:13px}
.fr{color:var(--mu);font-style:normal;font-size:15px;margin:0 0 8px}
.de{font-weight:600;margin:0;font-size:17px}

/* Boutons */
button,.b{appearance:none;-webkit-appearance:none;background:var(--g);color:#fff;border:0;border-radius:8px;
  padding:11px 18px;font:500 16px/1.2 -apple-system,"Helvetica Neue",sans-serif;cursor:pointer;
  text-decoration:none;display:inline-block;text-align:center;transition:opacity .15s,transform .1s}
button:active,.b:active{opacity:.55}
button.s{background:rgba(0,122,255,.1);color:var(--g);border:0}
@media (prefers-color-scheme:dark){button.s{background:rgba(10,132,255,.2)}}

/* Champs */
input,select,textarea{width:100%;padding:11px 12px;border:.5px solid var(--bd);border-radius:8px;
  font:inherit;margin:4px 0 10px;background:var(--cd);color:var(--tx);outline:none;
  -webkit-appearance:none;appearance:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(0,122,255,.18)}
textarea{min-height:96px;resize:vertical}

/* Barre d'onglets translucide */
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:7px 0 6px;font-size:10px;font-weight:500;letter-spacing:.1px}
nav button:active{opacity:.5}
nav button.on{color:var(--g);font-weight:600}
nav i{display:block;font-style:normal;font-size:23px;line-height:1.2;margin-bottom:1px}

/* Alerte */
.w{background:rgba(255,204,0,.16);color:#7a5c00;border-radius:10px;padding:11px 13px;font-size:14px;margin:10px 0}
@media (prefers-color-scheme:dark){.w{color:#ffd60a}}

.r{display:flex;gap:8px;flex-wrap:wrap}

/* Bulle façon iOS */
.msg{background:rgba(0,122,255,.09);border-left:0;padding:9px 13px;margin:8px 0;border-radius:14px 14px 14px 4px}

.p{color:var(--ok)}.n{color:var(--ko)}
.t{font-weight:600;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.3px;margin:16px 4px 6px}
</style></head><body><header><b>Deutsch Freunde B2</b><span id="who" class="m"></span></header>
<main id="v"></main><nav id="nv"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js'))</script>
</body></html>
