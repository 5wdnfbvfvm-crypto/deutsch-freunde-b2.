<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deutsch Freunde B2</title><link rel="manifest" href="manifest.json">

<style>
:root{--g:#1f4d36;--g2:#2f6b4d;--cr:#f6f0e1;--bg:#fbf8f0;--cd:#fff;--tx:#1d2a22;--mu:#66736b;--bd:#e4dcc6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,sans-serif;padding-top:env(safe-area-inset-top)}
header{background:var(--g);color:var(--cr);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}header b{font:700 19px Georgia,serif}
main{max-width:760px;margin:auto;padding:14px 14px 96px}h2{font:700 20px Georgia,serif;color:var(--g);margin:6px 0 10px}h3{margin:0 0 4px;font-size:16px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:13px;margin:0 0 11px}.m{color:var(--mu);font-size:13px}
.fr{color:var(--mu);font-style:italic;font-size:14px;margin:0 0 8px}.de{font-weight:600;margin:0}
button,.b{background:var(--g2);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}button.s{background:var(--cr);color:var(--tx);border:1px solid var(--bd)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;font:inherit;margin:4px 0 8px;background:#fff;color:var(--tx)}textarea{min-height:90px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:8px 0;font-size:11px}nav button.on{color:var(--g);font-weight:700}nav i{display:block;font-style:normal;font-size:19px}
.w{background:#fff6dc;color:#5b4a12;border:1px solid #e6cf84;border-radius:10px;padding:9px;font-size:13px;margin:8px 0}.r{display:flex;gap:8px;flex-wrap:wrap}.msg{border-left:3px solid #c9a24b;background:var(--cr);padding:5px 10px;margin:7px 0;border-radius:0 8px 8px 0}
.p{color:#2e8b57}.n{color:#c0504d}.t{font-weight:700;margin:10px 0 4px}
</style></head><body><header><b>🌲 Deutsch Freunde B2</b><span id="who" class="m" style="color:#cfe3d6"></span></header>
